# Based on emreekici3/dotfiles; adapted for Paneru 0.5.1.
[options]
focus_follows_mouse = true
mouse_follows_focus = false
animation_speed = 40
virtual_workspace_animations = false
preset_column_widths = [0.25, 0.333, 0.5, 0.667, 1.0]
window_resize_cycle = true
menubar_height = 40

[padding]
top = 8
bottom = 8
left = 8
right = 8

# Hyprland scrolling muscle memory: Super maps to Option on macOS.
[bindings]
window_focus_west = ["alt - h", "alt - leftarrow", "ctrl + alt - ,"]
window_focus_east = ["alt - l", "alt - rightarrow", "ctrl + alt - ."]
window_focus_north = ["alt - k", "alt - uparrow"]
window_focus_south = ["alt - j", "alt - downarrow"]
window_swap_west = ["alt + shift - h", "alt + shift - leftarrow", "cmd + ctrl + alt - ,"]
window_swap_east = ["alt + shift - l", "alt + shift - rightarrow", "cmd + ctrl + alt - ."]
window_stack = "alt - o"
window_unstack = "alt - t"
window_resize = ["alt - v", "ctrl + alt - ]"]
# Reverse cycle; Paneru TOML has no direct reset-to-50% action.
window_shrink = ["alt + shift - v", "ctrl + alt - ["]
window_fullwidth = ["alt - f", "ctrl + alt - '"]
window_manage = ["alt - space", "ctrl + alt - ;"]
window_snap = "alt + shift - space"
window_center = ["alt - c", "ctrl + alt - c"]
window_nextdisplay = ["alt - n", "ctrl + alt - n"]
quit = "ctrl + alt - q"
window_virtualnum_1 = "alt - 1"
window_virtualmovenum_1 = "alt + shift - 1"
window_virtualnum_2 = "alt - 2"
window_virtualmovenum_2 = "alt + shift - 2"
window_virtualnum_3 = "alt - 3"
window_virtualmovenum_3 = "alt + shift - 3"
window_virtualnum_4 = "alt - 4"
window_virtualmovenum_4 = "alt + shift - 4"

[swipe]
deceleration = 4.0
sensitivity = 0.2
continuous = false

[swipe.scroll]
modifier = "alt"
window_step = true

# Three-finger gestures scroll the Paneru window layout.
[swipe.gesture]
fingers_count = 3
direction = "Natural"

[decorations.inactive.dim]
opacity_night = 0.0

[windows.appcleaner]
title = ".*"
bundle_id = "net.freemacsoft.AppCleaner"
floating = true

[windows.calculator]
title = ".*"
bundle_id = "com.apple.calculator"
floating = true

[windows.cleantool]
title = ".*"
bundle_id = "com.hegenberg.KeyboardCleanTool"
floating = true

[windows.quicktime]
title = ".*"
bundle_id = "com.apple.QuickTimePlayerX"
floating = true

[windows.finder-info]
title = ".*(Info|Bilgisi)"
bundle_id = "com.apple.finder"
floating = true

[windows.music]
title = ".*"
bundle_id = "com.apple.Music"
width = 0.75

[windows.tinycast]
bundle_id = "com.tinycast.app"
title = ".*"
floating = true

[windows.all]
title = ".*"
horizontal_padding = 3
vertical_padding = 0
width = 0.5
