# Madoka / shooting stars — blush glass over the desktop's own wallpaper.
# Clock + date layout inspired by typecraft-dev/dotfiles (Hyprlock).
$rose = rgba(ed78acff)
$blush = rgba(ffe7f2ff)
$muted = rgba(dfabc0ff)

general {
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/assets/dotfiles/desktop/linux/niri/wallpapers/madoka-shooting-stars.png
    color = rgba(24213bff)
    blur_passes = 0
    brightness = 0.7
}

label {
    monitor =
    text = ✦  S T A R L I G H T
    color = $rose
    font_size = 15
    font_family = Inter Medium
    position = 10%, 180
    halign = left
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $blush
    font_size = 100
    font_family = Inter Light
    position = 10%, 80
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(18132480)
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C /run/current-system/sw/bin/date '+%A, %d %B'
    color = $muted
    font_size = 18
    font_family = Inter
    position = 10%, -10
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    position = 10%, -110
    halign = left
    valign = center
    rounding = 28
    outline_thickness = 2
    outer_color = rgba(ed78ac99)
    inner_color = rgba(24213bcc)
    font_color = $blush
    font_family = Inter
    placeholder_text = <span foreground="##dfabc0">Password</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.3
    check_color = $rose
    fail_color = rgba(ff6b8aff)
    fail_text = <span foreground="##ffb8cd">Try again ($ATTEMPTS)</span>
    capslock_color = rgba(f5d494ff)
}
